name: fitness-rpg-postgres-local
services:
  postgres:
    image: postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    container_name: fitness-rpg-postgres-local-db
    restart: unless-stopped
    env_file: .local/postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fitness_rpg -d fitness_rpg"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
volumes:
  postgres-data:
    name: fitness-rpg-postgres-local-data
